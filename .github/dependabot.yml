version: 2

# Cooldown (default-days: 3) is kept in sync with pnpm-workspace.yaml's
# minimumReleaseAge (4320 min = 3 days) so a PR never opens before the version is
# installable in CI. Groups cover minor+patch only, so major bumps arrive as
# individual PRs to be reviewed one at a time; semver-major-days holds them 14 days.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      composer-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
